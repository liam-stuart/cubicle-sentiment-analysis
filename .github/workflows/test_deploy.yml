name: Code Testing/Deployment

on:
  push:
    branches: ["main"]

jobs:
  unittest:
    name: Unit Tests/Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Start Python & uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          activate-environment: true
          python-version: "3.12"
          enable-cache: true

      - name: Unit Tests/Coverage
        run: |
          uv pip install -r requirements.txt --index-strategy unsafe-best-match
          uv pip install pytest pytest-cov
          uv run pytest --cov=app --cov=model --cov=preprocessing --cov=train --cov=utils src/tests --cov-report= --cov-append
          uv run coverage report --fail-under=90

  flake8:
    name: Code Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Start Python & uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          activate-environment: true
          python-version: "3.12"
          enable-cache: true

      - name: Code Format
        run: |
          uv pip install flake8 pep8-naming
          flake8 --max-line-length=120 src

  build_push:
    name: Build/Push
    runs-on: ubuntu-latest
    needs: [unittest, flake8]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Docker
        uses: docker/setup-buildx-action@v4

      - name: GitHub Container Registry Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build/Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
